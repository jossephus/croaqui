name: Build Flatpak

on:
  push

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      
      - name: Build Flatpak
        run: nix build .#flatpak-build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: croaqui-flatpak
          path: result/repo/
