name: Build Flatpak

on:
  push

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      
      - name: Install Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      
      - name: Build Flatpak manifest
        run: nix build .#flatpak-manifest -o flatpak-manifest
      
      - name: Build with flatpak-builder
        run: |
          mkdir -p /tmp/croaqui-build /tmp/croaqui-repo
          cp flatpak-manifest/com.github.H0lyDiv3r.croaqui.json flatpak/
          flatpak-builder --force-clean --default-branch=master \
            --ccache \
            /tmp/croaqui-build \
            flatpak/com.github.H0lyDiv3r.croaqui.json
          flatpak build-export /tmp/croaqui-repo /tmp/croaqui-build master
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: croaqui-flatpak
          path: /tmp/croaqui-repo/
