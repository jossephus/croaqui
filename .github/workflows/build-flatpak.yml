name: Build Flatpak

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = false

      - name: Setup Cachix
        uses: cachix/cachix-action@v12
        with:
          name: croaqui
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true

      - name: Build Flatpak package
        run: nix build .#flatpak --print-build-logs

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: croaqui-flatpak
          path: result/com.github.H0lyDiv3r.croaqui.flatpak
          retention-days: 30

      - name: Upload Flatpak repository
        uses: actions/upload-artifact@v4
        with:
          name: croaqui-flatpak-repo
          path: result/repo
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            result/com.github.H0lyDiv3r.croaqui.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
